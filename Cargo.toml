[package]
name = "mazo"
version = "0.1.0"
edition = "2024"
description = "Personal skill manager: usage from agent transcripts, sync of skill links"
license = "MIT"
repository = "https://github.com/nicolasgarcia214/mazo"
homepage = "https://github.com/nicolasgarcia214/mazo"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "mazo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1.11"
saphyr = "0.2.1"
saphyr-parser = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha1_smol = "1"
toml = "1"
unicode-width = "0.2.2"
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Releases go out through dist, not crates.io
[package.metadata.dist]
dist = true
