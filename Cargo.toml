[package]
name = "skima"
version = "0.1.0"
edition = "2024"
description = "Personal skill manager: usage from agent transcripts, sync of skill links"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "skima"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
jiff = "0.2"
regex = "1.11"
saphyr = "0.2.1"
saphyr-parser = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1_smol = "1"
toml = "1"
url = "2.5"

[dev-dependencies]
tempfile = "3"
